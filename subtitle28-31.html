<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle 28-31 Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            background-color: #2c3e50; /* Consistent dark background */
            color: #ecf0f1;
            margin: 0;
            overflow: hidden;
        }
        #main-container {
            position: relative;
            width: 700px;
            height: 450px; /* Ample height for content */
            /* border: 1px dashed #777; */
            text-align: center;
        }
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            display: none; /* scenes are hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .scene-text {
            font-size: 1.8em;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .emoji { font-size: 3em; } /* Base emoji size */

        /* Recap Scene */
        #network-placeholder {
            width: 180px; /* Wider for 3 nodes */
            height: 80px;
            border: 2px dashed #7f8c8d; /* Grey dash */
            margin: 15px auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            position: relative; /* For magnifying glass positioning */
        }
        .placeholder-node {
            width: 25px;
            height: 25px;
            background-color: #7f8c8d;
            border-radius: 50%;
            opacity: 0; transform: scale(0.5); /* For animation */
        }
        #magnifying-glass {
            font-size: 3em;
            position: absolute;
            top: 50%; left: 50%; /* Start centered on placeholder */
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
        }

        /* Design Question Scene */
        #big-question-mark { font-size: 4.5em; margin-bottom: 10px; }
        #drafting-tools span { font-size: 2.5em; margin: 0 8px; display: inline-block;}

        /* Teaser Scene */
        #golden-modules-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0; /* More margin for visual separation */
        }
        .golden-module {
            width: 60px; /* Slightly larger */
            height: 80px;
            background-color: #ffd700; /* Gold */
            border: 2px solid #DAA520; /* Darker gold border */
            border-radius: 6px;
            margin: 0 12px;
            opacity: 0;
            transform: translateY(20px);
            box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em; /* For number inside */
            color: #333; /* Number color */
            font-weight: bold;
        }
        .highlight { color: #ffd700; font-weight: bold; } /* Gold highlight */
        #text-golden-modules-title { font-size: 1.7em; }
        #text-remember .emoji { font-size: 1em; /* Smaller pin emoji */ vertical-align: middle;}
        #text-remember { font-size: 1.4em; margin-top: 15px;}

    </style>
</head>
<body>
    <div id="main-container">
        <div class="scene" id="recap-scene">
            <p class="scene-text" id="text-recap">看清了共生网络的重要性...</p>
            <div id="network-placeholder">
                <div class="placeholder-node"></div>
                <div class="placeholder-node"></div>
                <div class="placeholder-node"></div>
                <span class="emoji" id="magnifying-glass">🔎</span>
            </div>
        </div>

        <div class="scene" id="design-question-scene">
            <span class="emoji" id="big-question-mark">❓</span>
            <p class="scene-text" id="text-design-question">但怎么具体设计？</p>
            <div id="drafting-tools">
                <span class="emoji">✏️</span>
                <span class="emoji">📐</span>
            </div>
        </div>

        <div class="scene" id="teaser-scene">
            <p class="scene-text" id="text-next-time">下一期 Liya 带你拆解</p>
            <div id="golden-modules-container">
                <div class="golden-module" id="module1">1</div>
                <div class="golden-module" id="module2">2</div>
                <div class="golden-module" id="module3">3</div>
            </div>
            <p class="scene-text" id="text-golden-modules-title">'共生型商业模式的<br><span class='highlight'>3</span> 个 <span class='highlight'>黄金模块</span>'</p>
            <p class="scene-text" id="text-remember">—— 记住 <span class='emoji'>📌</span></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const recapScene = document.getElementById('recap-scene');
            const networkPlaceholder = document.getElementById('network-placeholder');
            const magnifyingGlass = document.getElementById('magnifying-glass');
            const questionScene = document.getElementById('design-question-scene');
            const teaserScene = document.getElementById('teaser-scene');

            const sceneDisplayDuration = 2500;
            const fadeDuration = 500;

            const tl = anime.timeline({ easing: 'easeOutExpo' });

            function displayScene(sceneEl) {
                sceneEl.style.display = 'flex';
                tl.add({ targets: sceneEl, opacity: [0, 1], duration: fadeDuration });
            }
            function undisplayScene(sceneEl, delay = sceneDisplayDuration) {
                tl.add({ targets: sceneEl, opacity: 0, duration: fadeDuration, delay: delay })
                  .add({ targets: sceneEl, display: 'none', duration: 1 });
            }

            // Recap Scene
            displayScene(recapScene);
            tl.add({ targets: '#text-recap', opacity: [0,1], translateY: [-10,0]}, '-=300');
            tl.add({
                targets: '.placeholder-node',
                opacity: [0,1], scale:[0.5,1],
                delay: anime.stagger(150)
            }, '-=300');
            tl.add({
                targets: magnifyingGlass,
                opacity: [0, 1],
                scale: [0.8, 1.1, 1], // Pop in
                translateX: ['-50%', '-50%', '-70%', '-30%', '-50%'], // Move left and right over placeholder
                translateY: ['-50%', '-50%'], // Keep centered vertically on itself
                duration: 1500,
            }, '-=500');
            undisplayScene(recapScene);

            // Design Question Scene
            displayScene(questionScene);
            tl.add({ targets: '#text-design-question', opacity: [0,1], scale:[0.9,1]}, '-=300');
            tl.add({ targets: '#big-question-mark', scale: [0.5, 1.1, 1], rotate: [-10, 5, 0], duration: 800}, '-=600');
            tl.add({
                targets: '#drafting-tools span',
                opacity: [0,1],
                translateY: [10,0],
                rotate: () => anime.random(-15, 15),
                scale: [0.7, 1],
                delay: anime.stagger(200),
                duration: 600
            }, '-=500');
            undisplayScene(questionScene);

            // Teaser Scene
            displayScene(teaserScene);
            tl.add({ targets: '#text-next-time', opacity: [0,1], translateY: [-10,0]}, '-=300');
            tl.add({
                targets: '.golden-module',
                opacity: [0,1],
                translateY: [20,0],
                scale: [0.8, 1.05, 1],
                delay: anime.stagger(250, {start: 300}), // Start after text-next-time
                duration: 700
            });
            tl.add({
                targets: '#text-golden-modules-title',
                opacity: [0,1],
                scale: [0.9, 1],
                duration: 800
            }, '-=500'); // Overlap with modules appearing
            tl.add({
                targets: '#text-remember',
                opacity: [0,1],
                translateY: [10,0],
                duration: 600
            }, '-=300');
            tl.add({ // Pin emoji pop
                targets: '#text-remember .emoji',
                scale: [1, 1.3, 1],
                duration: 500
            }, '-=400');

            // Keep final scene visible
            tl.add({ duration: sceneDisplayDuration + 2000 });
        });
    </script>
</body>
</html>
