<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle 8-9 Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            background-color: #D0F0C0; /* Light green rainforest feel */
            color: #333;
            margin: 0;
            overflow: hidden;
        }
        #rainforest-container {
            text-align: center;
            position: relative;
            width: 500px; /* Container width for positioning */
            height: 400px; /* Container height */
           /* border: 1px dashed #888; */ /* For debugging layout */
        }
        #text-intro {
            font-size: 2em;
            opacity: 0;
            margin-bottom: 30px; /* Space before plants appear */
            position: relative; /* To ensure it's above plants if they overlap */
            z-index: 10;
        }

        #plants-area {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .plant-group {
            position: absolute;
            display: flex;
            flex-direction: column; /* Emoji above label */
            align-items: center;
            opacity: 0; /* Group opacity for coordinated fade-in */
        }
        .plant-emoji {
            font-size: 3.5em; /* Emoji size */
            display: block; /* Allow margin bottom */
            margin-bottom: 5px;
        }
        .plant-label {
            font-size: 1em;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 2px 8px;
            border-radius: 4px;
            color: #111;
        }

        /* Positioning plant groups */
        #tree-group {
            top: 50px; /* Higher up */
            left: 50%;
            transform: translateX(-50%);
        }
        #shrub-group {
            top: 180px; /* Middle */
            left: 30%; /* Slightly to the left */
            transform: translateX(-50%);
        }
        #fungus-group {
            top: 280px; /* Lower down */
            left: 70%; /* Slightly to the right */
            transform: translateX(-50%);
        }

        #connection-lines-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Behind plant groups or at least labels */
        }
        #connection-lines-svg line {
            stroke-width: 2.5;
        }

        #text-interconnected {
            font-size: 2em;
            opacity: 0;
            margin-top: 40px; /* Space after plants/lines */
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="rainforest-container">
        <p id="text-intro">就像热带雨林里...</p>

        <div id="plants-area">
            <div class="plant-group" id="tree-group">
                <span class="plant-emoji" id="tree">🌳</span>
                <span class="plant-label" id="label-tree">乔木</span>
            </div>
            <div class="plant-group" id="shrub-group">
                <span class="plant-emoji" id="shrub">🌿</span>
                <span class="plant-label" id="label-shrub">灌木</span>
            </div>
            <div class="plant-group" id="fungus-group">
                <span class="plant-emoji" id="fungus">🍄</span>
                <span class="plant-label" id="label-fungus">真菌</span>
            </div>
        </div>
        <svg id="connection-lines-svg"></svg>

        <p id="text-interconnected">谁也离不开谁。</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const textIntro = document.getElementById('text-intro');
            const treeGroup = document.getElementById('tree-group');
            const shrubGroup = document.getElementById('shrub-group');
            const fungusGroup = document.getElementById('fungus-group');
            const linesSvg = document.getElementById('connection-lines-svg');
            const textInterconnected = document.getElementById('text-interconnected');

            // Helper to get center of an emoji within its group
            function getEmojiCenter(groupId) {
                const group = document.getElementById(groupId);
                const emoji = group.querySelector('.plant-emoji');
                const groupRect = group.getBoundingClientRect(); // Position of the group
                const containerRect = document.getElementById('rainforest-container').getBoundingClientRect();

                // Calculate center relative to the #rainforest-container
                // Emoji is centered horizontally within its group by flexbox
                // Vertically, emoji is at the top of the group.
                const emojiRect = emoji.getBoundingClientRect();

                return {
                    x: groupRect.left - containerRect.left + groupRect.width / 2,
                    y: groupRect.top - containerRect.top + emojiRect.height / 2 // Center of the emoji itself
                };
            }

            const tl = anime.timeline({
                easing: 'easeOutExpo',
                duration: 750
            });

            tl.add({
                targets: textIntro,
                opacity: [0, 1],
                translateY: [-20, 0],
                duration: 1000
            });

            // Plant appearances
            const plantGroups = [treeGroup, shrubGroup, fungusGroup];
            plantGroups.forEach(group => {
                tl.add({
                    targets: group,
                    opacity: [0, 1],
                    scale: [0.7, 1],
                    duration: 800,
                    easing: 'easeOutElastic(1, .7)'
                }, '-=400'); // Stagger appearance
            });

            // Define connections (fromId, toId, color)
            const connections = [
                { from: 'tree-group', to: 'shrub-group', color: '#228B22' }, // Forest Green (vines)
                { from: 'tree-group', to: 'fungus-group', color: '#8B4513' }, // SaddleBrown (roots)
                { from: 'shrub-group', to: 'fungus-group', color: '#A0522D' }  // Sienna (organic matter)
            ];

            // Add a slight delay for lines to start drawing after plants fully appear
            tl.add({ duration: 200 });

            connections.forEach(conn => {
                const p1 = getEmojiCenter(conn.from);
                const p2 = getEmojiCenter(conn.to);

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', p1.x);
                line.setAttribute('y1', p1.y);
                line.setAttribute('x2', p2.x); // Draw to target initially for length calculation
                line.setAttribute('y2', p2.y);
                line.style.stroke = conn.color;
                linesSvg.appendChild(line);

                const length = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                line.style.strokeDasharray = length;
                line.style.strokeDashoffset = length;

                // Reset x2, y2 for animation if preferred (draw from p1 to p1 then to p2)
                // line.setAttribute('x2', p1.x);
                // line.setAttribute('y2', p1.y);

                tl.add({
                    targets: line,
                    // x2: p2.x, // Animate if x2/y2 reset
                    // y2: p2.y,
                    strokeDashoffset: [length, 0], // Animate dash offset
                    duration: 800,
                    easing: 'easeInOutSine'
                }, '-=500'); // Stagger line drawing
            });

            // Final text
            tl.add({
                targets: textInterconnected,
                opacity: [0, 1],
                scale: [0.8, 1],
                duration: 1000,
                easing: 'easeOutElastic(1, .8)'
            }, '+=300'); // After lines are mostly drawn

        });
    </script>
</body>
</html>
