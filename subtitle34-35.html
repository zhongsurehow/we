<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle 34-35 Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            background-color: #34495e; /* Dark blue background */
            color: #ecf0f1;
            margin: 0;
            overflow: hidden;
        }
        #main-container {
            position: relative;
            width: 700px;
            height: 450px;
            text-align: center;
            /* border: 1px dashed #777; */
        }
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            display: none; /* scenes are hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .scene-text {
            font-size: 1.9em; /* Slightly larger text */
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .emoji { font-size: 3.5em; display: inline-block; }

        /* Curiosity Scene */
        #curiosity-emojis { display: flex; align-items: center; margin-bottom: 15px; }
        #curious-eyes { font-size: 4em; margin-right: 10px;}
        #thinking-face-q-group { display: flex; align-items: center; }
        #thinking-face-emoji { font-size: 3.5em; }
        #question-mark-emoji { font-size: 2.5em; color: #f1c40f; margin-left: -5px; }

        /* Follow Action Scene */
        #follow-button {
            padding: 12px 25px;
            background-color: #3498db; /* Blue button */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.3em;
            cursor: pointer;
            box-shadow: 0 4px #2980b9; /* Simple 3D effect */
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        #follow-button:hover { background-color: #2ecc71; box-shadow: 0 4px #27ae60; } /* Green on hover */
        #follow-button:active { transform: translateY(2px); box-shadow: 0 2px #27ae60; }
        #pointer-hand {
            position: absolute;
            font-size: 2.5em;
            opacity: 0;
            transform: rotate(-15deg); /* Initial tilt */
        }
        #bell-icon {
            font-size: 2.8em;
            opacity: 0;
            transform: scale(0.5);
            margin-left: 15px; /* Space from button */
            color: #f1c40f; /* Gold bell */
            display: inline-block; /* For transform-origin */
            transform-origin: top center;
        }

        /* Reveal Teaser Scene */
        #treasure-chest { font-size: 5em; margin-bottom: 20px; display: inline-block;}
        #sparkle-container {
            position: absolute; /* Centered on treasure chest */
            width: 1px; height: 1px;
            /* border: 1px solid red; */ /* Debugging */
        }
        .sparkle {
            position: absolute;
            background-color: #f1c40f; /* Gold sparkles */
            border-radius: 50%;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div class="scene" id="curiosity-scene">
            <div id="curiosity-emojis">
                <span class="emoji" id="curious-eyes">👀</span>
                <div id="thinking-face-q-group">
                    <span class="emoji" id="thinking-face-emoji">🤔</span>
                    <span class="emoji" id="question-mark-emoji">❓</span>
                </div>
            </div>
            <p class="scene-text" id="text-want-to-know">想知道怎么做到？</p>
        </div>

        <div class="scene" id="follow-action-scene">
            <p class="scene-text" id="text-follow-me">关注我，</p>
            <div style="position:relative; display:inline-flex; align-items:center;"> <!-- Wrapper for button and bell -->
                 <div id="follow-button">关注</div>
                 <span class="emoji" id="bell-icon">🔔</span>
            </div>
            <span class="emoji" id="pointer-hand">👉</span>
        </div>

        <div class="scene" id="reveal-teaser-scene">
            <p class="scene-text" id="text-next-reveal">下期揭秘！</p>
            <div style="position:relative;"> <!-- Wrapper for chest and sparkles -->
                <span class="emoji" id="treasure-chest">🎁</span>
                <div id="sparkle-container"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mainContainer = document.getElementById('main-container');
            const curiosityScene = document.getElementById('curiosity-scene');
            const followScene = document.getElementById('follow-action-scene');
            const revealScene = document.getElementById('reveal-teaser-scene');

            const curiousEyes = document.getElementById('curious-eyes');
            const thinkingFace = document.getElementById('thinking-face-emoji');
            const questionMark = document.getElementById('question-mark-emoji');
            const followButton = document.getElementById('follow-button');
            const pointerHand = document.getElementById('pointer-hand');
            const bellIcon = document.getElementById('bell-icon');
            const treasureChest = document.getElementById('treasure-chest');
            const sparkleContainer = document.getElementById('sparkle-container');

            const sceneDisplayDuration = 2500;
            const fadeDuration = 500;

            const tl = anime.timeline({ easing: 'easeOutExpo' });

            function displayScene(sceneEl) {
                sceneEl.style.display = 'flex';
                tl.add({ targets: sceneEl, opacity: [0, 1], duration: fadeDuration });
            }
            function undisplayScene(sceneEl, delay = sceneDisplayDuration) {
                tl.add({ targets: sceneEl, opacity: 0, duration: fadeDuration, delay: delay })
                  .add({ targets: sceneEl, display: 'none', duration: 1 });
            }

            // Curiosity Scene
            displayScene(curiosityScene);
            tl.add({ targets: '#text-want-to-know', opacity: [0,1], translateY: [-10,0]}, '-=300');
            tl.add({ targets: curiousEyes, scale: [0.8, 1], keyframes: [ { چشم: '👀', duration: 100 }, { چشم: '👀', duration: 100, translateX: -5}, { چشم: '👀', duration: 100, translateX: 5}, { چشم: '👀', duration: 100, translateX: 0}] }, '-=600'); // Simple text change for eyes
            tl.add({ targets: thinkingFace, scale: [0.5, 1.1, 1], rotate: [-5, 5, 0], duration: 700}, '-=700');
            tl.add({ targets: questionMark, scale: [0.5, 1.2, 1], opacity:[0,1], duration: 500, }, '-=500');
            undisplayScene(curiosityScene);

            // Follow Action Scene
            displayScene(followScene);
            tl.add({ targets: '#text-follow-me', opacity: [0,1], translateY: [-10,0]}, '-=300');
            tl.add({ targets: followButton, scale: [0.8, 1], duration: 600}, '-=400');

            // Position pointer hand
            const buttonRect = followButton.getBoundingClientRect();
            const mainRect = mainContainer.getBoundingClientRect();
            pointerHand.style.left = (buttonRect.right - mainRect.left + 10) + 'px';
            pointerHand.style.top = (buttonRect.top - mainRect.top + buttonRect.height / 2 - pointerHand.offsetHeight / 2) + 'px';

            tl.add({ targets: pointerHand, opacity: [0,1], translateX: [20, 0], duration: 500 }, '-=300');
            // "Click" animation
            tl.add({ targets: pointerHand, translateX: -5, scale:0.9, duration: 150, easing: 'easeInSine' });
            tl.add({
                targets: followButton,
                scale: [1, 0.95],
                translateY: [0, 2], // Simulate press
                boxShadow: ['0 4px #2980b9', '0 2px #2980b9'],
                duration: 150,
                easing: 'easeInSine'
            }, '-=150');
            tl.add({ targets: pointerHand, translateX: 0, scale:1, duration: 150, easing: 'easeOutSine' });
            tl.add({
                targets: followButton,
                scale: [0.95, 1],
                translateY: [2, 0],
                boxShadow: ['0 2px #2980b9', '0 4px #2980b9'],
                duration: 150,
                easing: 'easeOutSine'
            }, '-=150');

            // Bell icon appears and rings
            tl.add({
                targets: bellIcon,
                opacity: [0,1],
                scale: [0.5, 1.1, 1],
                duration: 500
            }, '-=100');
            tl.add({
                targets: bellIcon,
                rotate: [0, -15, 15, -10, 10, 0], // Ringing motion
                duration: 800,
                easing: 'easeInOutSine'
            }, '-=300');
            undisplayScene(followScene);

            // Reveal Teaser Scene
            displayScene(revealScene);
            tl.add({ targets: '#text-next-reveal', opacity: [0,1], translateY: [-10,0]}, '-=300');
            tl.add({
                targets: treasureChest,
                scale: [0.5, 1.05, 1],
                rotate: [-5, 5, 0], // Slight wobble
                duration: 800
            }, '-=500');

            // Sparkle burst from treasure chest
            const chestRect = treasureChest.getBoundingClientRect();
            sparkleContainer.style.left = (chestRect.left - mainRect.left + chestRect.width / 2) + 'px';
            sparkleContainer.style.top = (chestRect.top - mainRect.top + chestRect.height / 2) + 'px';

            for (let i = 0; i < 20; i++) { // 20 sparkles
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                const size = anime.random(3, 8);
                sparkle.style.width = size + 'px';
                sparkle.style.height = size + 'px';
                sparkleContainer.appendChild(sparkle);

                tl.add({
                    targets: sparkle,
                    opacity: [0.8, 0],
                    translateX: anime.random(-60, 60),
                    translateY: anime.random(-60, 60),
                    scale: [1, 0.3],
                    duration: anime.random(600, 1000),
                    easing: 'easeOutCirc'
                }, `-=${i === 0 ? 600 : 950 + Math.random()*50}`); // Staggered burst
            }

            // Keep final scene visible
            tl.add({ duration: sceneDisplayDuration + 1500 });
        });
    </script>
</body>
</html>
