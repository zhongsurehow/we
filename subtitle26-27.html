<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle 26-27 Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            background-color: #f7f9fc; /* Light, clean background */
            color: #333;
            margin: 0;
            overflow: hidden;
        }
        #main-container {
            position: relative;
            width: 700px;
            height: 500px; /* Increased height for content */
            /* border: 1px dashed #ccc; */
            text-align: center; /* Default text align for scenes */
        }
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            display: none; /* scenes are hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .scene-text {
            font-size: 1.8em;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .emoji { font-size: 3.5em; }

        /* Comment Submission Scene */
        #keyboard-emoji { margin-bottom: 15px; }
        #comment-input-field {
            width: 80%;
            min-height: 120px;
            border: 2px solid #dfe4ea;
            border-radius: 8px;
            margin: 10px auto;
            padding: 15px;
            background-color: #fff;
            position: relative; /* For flying emojis */
            overflow: hidden; /* Clip flying emojis if needed */
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 1.1em;
            color: #777; /* Placeholder text color */
        }
        #placeholder-text { display: inline-block; } /* For typing animation */
        #flying-emojis-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Don't intercept clicks */
        }
        .flying-emoji {
            position: absolute;
            font-size: 1.2em; /* Smaller emojis */
            opacity: 0;
        }

        /* Comment Selection Scene */
        #text-liya-selects .highlight-text {
            color: #ffbf00; /* Gold */
            font-weight: bold;
            font-size: 1.2em; /* Relative to parent */
        }
        #liya-avatar { font-size: 4em; margin-bottom: 20px; }
        #comments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); /* Responsive columns */
            gap: 15px;
            width: 90%;
            max-width: 600px; /* Max width for grid */
            margin: 20px auto;
        }
        .comment-bubble {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9em;
            color: #495057;
            opacity: 0;
            transform: translateY(20px);
            border: 2px solid transparent;
            transition: transform 0.2s ease-out, border-color 0.2s ease-out, background-color 0.2s ease-out; /* For selection */
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .comment-bubble.selected {
            border-color: #ffbf00; /* Gold border */
            background-color: #fff9e6; /* Light gold background */
            transform: translateY(0) scale(1.05); /* Pop effect */
            color: #333;
            font-weight: 500;
        }
        #selection-pointer { /* Temporary pointer emoji */
            position: absolute;
            font-size: 2em;
            opacity: 0;
            color: #ffbf00;
            z-index: 100;
            transform: translate(-50%, -100%); /* Position tip above target */
        }

    </style>
</head>
<body>
    <div id="main-container">
        <div class="scene" id="comment-submission-scene">
            <p class="scene-text" id="text-call-to-comment">把你的案例<br>敲在评论区</p>
            <span class="emoji" id="keyboard-emoji">⌨️</span>
            <div id="comment-input-field">
                <span id="placeholder-text"></span>
            </div>
            <div id="flying-emojis-container"></div>
        </div>

        <div class="scene" id="comment-selection-scene">
            <p class="scene-text" id="text-liya-selects">Liya 会抽取 <span class="highlight-text">3</span> 个<br>深度剖析！</p>
            <span class="emoji" id="liya-avatar">👩‍🏫</span>
            <div id="comments-grid">
                <!-- Comments will be added by JS -->
            </div>
            <span id="selection-pointer">👇</span> <!-- Or use ✨ -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const submissionScene = document.getElementById('comment-submission-scene');
            const selectionScene = document.getElementById('comment-selection-scene');
            const placeholderTextEl = document.getElementById('placeholder-text');
            const flyingEmojisContainer = document.getElementById('flying-emojis-container');
            const commentsGrid = document.getElementById('comments-grid');
            const selectionPointer = document.getElementById('selection-pointer');

            const sceneDisplayDuration = 3000;
            const fadeDuration = 500;

            const tl = anime.timeline({ easing: 'easeOutExpo' });

            function displayScene(sceneEl) {
                sceneEl.style.display = 'flex';
                tl.add({ targets: sceneEl, opacity: [0, 1], duration: fadeDuration });
            }
            function undisplayScene(sceneEl, delay = sceneDisplayDuration) {
                tl.add({ targets: sceneEl, opacity: 0, duration: fadeDuration, delay: delay })
                  .add({ targets: sceneEl, display: 'none', duration: 1 });
            }

            // Comment Submission Scene
            displayScene(submissionScene);
            tl.add({ targets: '#text-call-to-comment', opacity: [0,1], translateY: [-10,0]}, '-=300');
            tl.add({ targets: '#keyboard-emoji', scale: [0.8, 1, 1.1, 1], duration: 800}, '-=600');

            // Typing effect for placeholder
            const placeholderContent = "你的案例...";
            tl.add({
                targets: placeholderTextEl,
                innerHTML: [0, placeholderContent.length], // Animate innerHTML.length
                round: 1, // Round to whole numbers for character index
                duration: 1200,
                update: function(anim) { // Update text content based on rounded value
                    placeholderTextEl.textContent = placeholderContent.substring(0, anim.animations[0].currentValue);
                }
            }, '-=500');

            // Flying emojis into input field
            const flyingEmojiTypes = ['💡', '🚗', '🏠', '🌱', '💰'];
            for (let i = 0; i < 5; i++) {
                const飞moji = document.createElement('span');
                飞moji.classList.add('flying-emoji');
                飞moji.textContent = flyingEmojiTypes[anime.random(0, flyingEmojiTypes.length - 1)];
                飞moji.style.left = anime.random(0, 100) + '%'; // Start from random x
                飞moji.style.top = anime.random(-20, 0) + 'px';  // Start from above
                flyingEmojisContainer.appendChild(飞moji);

                tl.add({
                    targets: 飞moji,
                    opacity: [0.8, 0],
                    translateX: [0, (flyingEmojisContainer.offsetWidth / 2) -飞moji.offsetLeft - (飞moji.offsetWidth/2) + anime.random(-30,30) ],
                    translateY: [0, (flyingEmojisContainer.offsetHeight / 2) -飞moji.offsetTop - (飞moji.offsetHeight/2) + anime.random(-20,20)],
                    scale: [1, 0.3],
                    duration: anime.random(800, 1200),
                    easing: 'easeInQuad'
                }, `-=${i === 0 ? 900 : 1100 + Math.random()*100}`);
            }
            undisplayScene(submissionScene);

            // Comment Selection Scene
            displayScene(selectionScene);
            tl.add({ targets: '#text-liya-selects', opacity: [0,1], scale:[0.9,1]}, '-=300');
            tl.add({ targets: '#liya-avatar', scale: [0.8, 1, 1.1, 1], duration: 800}, '-=600');

            const numComments = 6;
            const commentBubbles = [];
            for (let i = 0; i < numComments; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('comment-bubble');
                bubble.textContent = `案例 ${String.fromCharCode(65 + i)}...`; // A, B, C...
                commentsGrid.appendChild(bubble);
                commentBubbles.push(bubble);
            }
            tl.add({
                targets: '.comment-bubble',
                opacity: [0,1],
                translateY: [20,0],
                delay: anime.stagger(150)
            }, '-=500');

            // Select 3 random bubbles
            const selectedIndices = [];
            while(selectedIndices.length < 3){
                const r = Math.floor(Math.random() * numComments);
                if(selectedIndices.indexOf(r) === -1) selectedIndices.push(r);
            }

            tl.add({ duration: 500 }); // Pause before selection

            selectedIndices.forEach((index, i) => {
                const bubbleToSelect = commentBubbles[index];
                const bubbleRect = bubbleToSelect.getBoundingClientRect();
                const gridRect = commentsGrid.getBoundingClientRect();

                // Position pointer over the bubble
                tl.add({
                    targets: selectionPointer,
                    left: bubbleRect.left - gridRect.left + bubbleRect.width / 2,
                    top: bubbleRect.top - gridRect.top, // Position tip above
                    opacity: [0, 1, 0], // Fade in, then out
                    scale: [0.5, 1, 0.5],
                    duration: 800,
                    easing: 'easeInOutQuad'
                }, i === 0 ? '+=0' : '-=200'); // Stagger pointer appearance

                tl.add({
                    targets: bubbleToSelect,
                    scale: [1, 1.1, 1], // Pop effect
                    duration: 400,
                    begin: function() {
                        bubbleToSelect.classList.add('selected');
                    },
                    complete: function() { // Ensure transform is reset if needed by CSS
                        bubbleToSelect.style.transform = 'scale(1.05)';
                    }
                }, '-=400'); // Overlap with pointer fadeout
            });

            // Keep final scene visible
            tl.add({ duration: sceneDisplayDuration + 1000 });
        });
    </script>
</body>
</html>
