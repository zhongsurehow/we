<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subtitle 2-3 Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            overflow: hidden; /* Hide scrollbars if animations go out of bounds */
        }
        .main-container {
            text-align: center;
            position: relative; /* For absolute positioning of scenes if needed */
        }
        #scene1-container, #scene2-container {
            padding: 20px;
            /* border: 1px solid #ccc; */ /* For layout debugging */
        }
        #scene2-container {
            display: none; /* Initially hidden */
        }

        /* Scene 1: 90% Failure */
        .blocks-container {
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Align blocks to bottom before falling */
            height: 100px; /* Give some space for blocks to fall */
            margin-bottom: 20px;
        }
        .block {
            width: 30px;
            height: 30px;
            background-color: #4CAF50; /* Green */
            margin: 0 5px;
            border-radius: 4px;
        }
        #text-90-failure {
            font-size: 2em;
            opacity: 0;
            margin-bottom: 30px;
        }
        #text-not-competitors { /* Optional text */
            font-size: 1.2em;
            opacity: 0;
            color: #555;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        /* Scene 2: Symbiotic Imbalance */
        .seesaw-container {
            position: relative;
            width: 300px;
            height: 150px; /* Increased height to accommodate cube movement */
            margin: 40px auto 20px; /* More margin top for text */
            display: flex; /* For centering plank if it's not full width */
            justify-content: center;
            align-items: center; /* Vertically center plank */
        }
        #seesaw-plank {
            width: 250px;
            height: 15px;
            background-color: #A0522D; /* Brown */
            border-radius: 5px;
            transform-origin: center center; /* Rotate around the center */
            position: relative; /* For cube positioning relative to plank */
        }
        .cube {
            width: 40px;
            height: 40px;
            background-color: #007bff; /* Blue */
            position: absolute;
            border-radius: 4px;
            transform-origin: center center;
        }
        #cube-left {
            bottom: 15px; /* Start on top of the plank */
            left: 30px; /* Position on the left side */
        }
        #cube-right {
            bottom: 15px; /* Start on top of the plank */
            right: 30px; /* Position on the right side */
        }
        #text-symbiotic-imbalance {
            font-size: 2em;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div id="scene1-container">
            <p id="text-90-failure">90% 商业模式失败</p>
            <div class="blocks-container">
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
                <div class="block"></div>
            </div>
            <p id="text-not-competitors">不是输给对手...</p>
        </div>

        <div id="scene2-container">
            <p id="text-symbiotic-imbalance">而是死于“共生失衡”？</p>
            <div class="seesaw-container">
                <div id="seesaw-plank">
                    <div class="cube" id="cube-left"></div>
                    <div class="cube" id="cube-right"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const scene1Container = document.getElementById('scene1-container');
            const scene2Container = document.getElementById('scene2-container');
            const blocks = document.querySelectorAll('#scene1-container .block');
            const text90Failure = document.getElementById('text-90-failure');
            const textNotCompetitors = document.getElementById('text-not-competitors');
            const textSymbioticImbalance = document.getElementById('text-symbiotic-imbalance');
            const seesawPlank = document.getElementById('seesaw-plank');
            const cubeLeft = document.getElementById('cube-left');
            const cubeRight = document.getElementById('cube-right');

            const tl = anime.timeline({
                easing: 'easeOutExpo',
                duration: 750
            });

            // Scene 1: 90% Failure
            tl.add({
                targets: text90Failure,
                opacity: [0, 1],
                translateY: [-20, 0],
                duration: 500
            })
            .add({
                targets: blocks,
                backgroundColor: (el, i) => (i < 9 ? '#FF5252' : '#4CAF50'), // 9 blocks red, 1 green
                translateY: (el, i) => (i < 9 ? [0, 70 + Math.random()*30] : 0),
                rotate: (el, i) => (i < 9 ? anime.random(-45, 45) : 0),
                opacity: (el, i) => (i < 9 ? 0 : 1),
                delay: anime.stagger(100, {from: 'first'}),
                duration: 600,
                easing: 'easeInOutQuad'
            }, '-=200') // Overlap slightly with text animation
            .add({ // Optional text fade in/out
                targets: textNotCompetitors,
                opacity: [0, 1, 0],
                translateY: [-10, 0, 0],
                duration: 1500, // Show for 1s, fade in/out 0.25s each
                easing: 'easeInOutSine'
            }, '-=300')
            .add({ // Transition to Scene 2
                targets: scene1Container,
                opacity: 0,
                duration: 500,
                easing: 'easeInOutQuad',
                complete: function() {
                    scene1Container.style.display = 'none';
                    scene2Container.style.display = 'block';
                    anime({ // Initial opacity for scene2Container elements
                        targets: scene2Container,
                        opacity: [0, 1],
                        duration: 100 // Fast fade-in for container
                    });
                }
            }, '+=500'); // Delay after blocks finish

            // Scene 2: Symbiotic Imbalance
            tl.add({
                targets: textSymbioticImbalance,
                opacity: [0, 1],
                translateY: [-20, 0],
                scale: [0.8, 1],
                duration: 600,
                easing: 'easeOutElastic(1, .8)'
            }, '+=200') // Add a slight delay after scene2 appears
            .add({
                targets: seesawPlank,
                rotate: -25, // Tilt angle
                duration: 1000,
                easing: 'easeInOutSine'
            }, '-=300') // Overlap with text appearance
            .add({
                targets: cubeLeft, // Cube on the side that goes up
                translateY: -45, // Move up
                translateX: -20, // Move slightly towards center/off edge
                rotate: -10,
                duration: 1000,
                easing: 'easeInOutSine'
            }, '-=1000') // Synchronize with plank tilt
            .add({
                targets: cubeRight, // Cube on the side that goes down
                translateY: 60,   // Move down
                translateX: 35,  // Move further towards edge/off
                rotate: 15,
                opacity: [1, 0.5], // Optionally fade as it 'falls'
                duration: 1000,
                easing: 'easeInOutSine'
            }, '-=1000'); // Synchronize with plank tilt

        });
    </script>
</body>
</html>
